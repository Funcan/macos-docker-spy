version: 2

builds:
  - id: probe
    main: ./cmd/probe
    binary: probe
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Version info comes from runtime/debug.ReadBuildInfo, not -X ldflags.
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: macos-docker-spy
    main: ./cmd/macos-docker-spy
    binary: macos-docker-spy
    # Fyne and the Dock icon code use Cocoa through cgo. The macOS runner's
    # clang builds both architectures.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  filters:
    exclude:
      - "^Merge "
